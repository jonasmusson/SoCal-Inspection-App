function releaseUrls(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];}
function imageUrl(asset){if(!asset?.blob)return '';const u=URL.createObjectURL(asset.blob);urls.push(u);return u;}
async function connect(){return await new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function request(store,mode,operation){return new Promise((resolve,reject)=>{const r=db.transaction(store,mode).objectStore(store)[operation.method](...operation.args);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
const getAll=store=>request(store,'readonly',{method:'getAll',args:[]});
const put=(store,obj)=>request(store,'readwrite',{method:'put',args:[obj]});
async function load(){state.projects=(await getAll('projects')).sort((a,b)=>a.name.localeCompare(b.name));state.assets=(await getAll('assets')).sort((a,b)=>b.uploadedAt.localeCompare(a.uploadedAt));}
async function init(){db=await connect();await load();if(!state.projects.length){for(const p of FALLBACK)await put('projects',{...p,id:newid(),createdAt:new Date().toISOString(),demo:true});await load();}bind();render();}
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,4200);}
function formatAssetInfo(a){return `${shortDate(a.fileModifiedAt)} · ${bytes(a.size)}`;}
function getProject(id){return state.projects.find(p=>p.id===id);}
function projectsForAssetCount(id){return state.assets.filter(a=>a.projectId===id).length;}
function lastPhoto(id){return state.assets.find(a=>a.projectId===id);}
function selectRoute(route){state.route=route;state.projectId=null;state.search='';state.filter='All';state.projectTab='gallery';render();window.scrollTo(0,0);}
function openProject(id){state.route='projects';state.projectId=id;state.search='';state.filter='All';state.projectTab='gallery';render();window.scrollTo(0,0);}
function metrics(){return {vehicles:state.projects.length,photos:state.assets.length,unsorted:state.assets.filter(a=>!a.projectId).length,review:state.assets.filter(a=>a.review).length};}
function notice(){return `<div class="notice"><span class="notice-icon" aria-hidden="true">ⓘ</span><p><b>Local workflow preview.</b> Photos added here stay in this browser—not in Google Drive, Supabase, or the other shop phone. Keep all originals backed up elsewhere. This is for testing layout and workflow, not daily customer storage.</p></div>`;}
function buttons(){return `<button class="btn btn-soft" data-action="new-project">＋ New vehicle</button>`;}
function render(){releaseUrls();const m=metrics();$('unsortedCount').textContent=m.unsorted||'';$('reviewCount').textContent=m.review||'';document.querySelectorAll('[data-route]').forEach(b=>{const active=b.dataset.route===state.route;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(state.route==='projects'){if(state.projectId)renderProject();else renderProjects();}else renderMediaView();}
function header({eyebrow,title,description,actions=''}){return `<section class="title-row"><div><div class="eyebrow">${eyebrow}</div><h1>${safe(title)}</h1><p>${safe(description)}</p></div>${actions?`<div class="title-actions">${actions}</div>`:''}</section>`;}
function renderProjects(){const m=metrics();$('crumb').textContent='PROJECTS';let html=header({eyebrow:'WORKSHOP / MEDIA',title:'Every build. Every detail.',description:'A home for the visual history of every vehicle, from the first inspection to the finished build.',actions:buttons()});html+=notice();html+=`<section class="summary-grid"><div class="metric"><small>Vehicle projects</small><strong>${m.vehicles}</strong><em>in workspace</em></div><div class="metric"><small>Photos saved here</small><strong>${m.photos}</strong><em>local copies</em></div><div class="metric"><small>Awaiting assignment</small><strong>${m.unsorted}</strong><em>unsorted</em></div></section>`;
html+=`<div class="section-head"><h2>Vehicle projects</h2><small>DEMO PROJECTS — EDIT TO MATCH YOUR SHOP</small></div><div class="toolbar"><label class="searchbox"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Find a vehicle, year or work order" aria-label="Search projects" value="${safe(state.search)}"></label><button class="btn btn-soft" data-action="export-manifest">↓ Export catalog</button></div>`;
html+=`<section class="project-grid" aria-label="Vehicle projects">${state.projects.map(p=>{const cover=lastPhoto(p.id);return `<button class="project-card filterable" data-search="${safe(`${p.name} ${p.reference||''}`.toLowerCase())}" data-action="open-project" data-id="${safe(p.id)}"><div class="project-cover">${cover?`<img alt="Latest photo from ${safe(p.name)}" src="${imageUrl(cover)}">`:`<div class="project-placeholder"><span>PROJECT MEDIA</span></div>`}<span class="project-badge">${p.demo?'SAMPLE PROJECT':safe(p.status||'ACTIVE').toUpperCase()}</span></div><div class="project-text"><h3>${safe(p.name)}</h3><p>${p.reference?`Work order: ${safe(p.reference)}`:'No work order linked'}</p><div class="project-foot"><span>${projectsForAssetCount(p.id)} ${projectsForAssetCount(p.id)===1?'photo':'photos'}</span><span>Open project ↗</span></div></div></button>`}).join('')}</section>`;html+=`<section class="hint-panel" style="margin-top:23px"><strong>Designed for real shop work.</strong><p>Choose a project before taking photos. Each image belongs to its vehicle, retains source file dates where available, and can later become inspection evidence or a marketing candidate—without uploading multiple copies of the original.</p></section>`;$('app').innerHTML=html;filterLocal();}
function activePhotos(){let assets=state.assets;if(state.route==='unsorted')assets=assets.filter(a=>!a.projectId);if(state.route==='review')assets=assets.filter(a=>a.review);if(state.route==='projects'&&state.projectId)assets=assets.filter(a=>a.projectId===state.projectId);if(state.filter!=='All')assets=assets.filter(a=>a.category===state.filter);return assets;}
function renderGallery(assets){return assets.length?`<section class="gallery-grid" aria-label="Photo gallery">${assets.map(a=>`<button data-action="photo-detail" data-id="${safe(a.id)}" class="image-card filterable" data-search="${safe(`${a.name} ${a.caption||''} ${a.category} ${getProject(a.projectId)?.name||''}`.toLowerCase())}"><div class="image-wrap"><img loading="lazy" alt="${safe(a.caption||a.name)}" src="${imageUrl(a)}"><span class="category-pill">${safe(a.category)}</span>${a.review?'<span class="review-pill">FOR REVIEW</span>':''}</div><div class="image-body"><strong>${safe(a.caption||a.name)}</strong><small>${safe(formatAssetInfo(a))}</small></div></button>`).join('')}</section>`:emptyGallery();}
function emptyGallery(){return `<section class="empty-state"><div><div class="bigicon">▧</div><h3>No photos here yet</h3><p>Start with a few existing pictures or take your first new photo. Everything should be organized around its vehicle.</p><button class="btn" data-action="add-photo">＋ Add first photos</button></div></section>`;}
function filterButtons(){return `<div class="pill-row" role="group" aria-label="Photo categories">${['All',...CATEGORIES].map(cat=>`<button class="pill-filter ${state.filter===cat?'active':''}" data-action="filter" data-value="${safe(cat)}" aria-pressed="${state.filter===cat}">${safe(cat)}</button>`).join('')}</div>`;}
function renderProject(){const p=getProject(state.projectId);if(!p){state.projectId=null;renderProjects();return;}$('crumb').textContent='PROJECT / '+p.name.toUpperCase();const count=projectsForAssetCount(p.id);const note=p.demo?'Sample vehicle · Replace with an actual current project':'Vehicle record · Local preview';let html=`<button class="bread-back" data-action="back">← All projects</button><div class="sample-note">${safe(note)}</div>`;html+=header({eyebrow:'ACTIVE VEHICLE / MEDIA',title:p.name,description:'All progress, inspection and reference images for this vehicle—organized in one place.',actions:`<button class="btn btn-soft" data-action="edit-project">Edit vehicle</button><button class="btn" data-action="add-photo">＋ Add photos</button>`});html+=notice();html+=`<div class="meta-chips"><span class="chip">${count} ${count===1?'photo':'photos'}</span><span class="chip">${p.reference?`RO ${safe(p.reference)}`:'Work order not linked'}</span><span class="chip">${safe(p.status||'active')}</span></div>`;html+=`<nav class="section-tabs" aria-label="Vehicle workspace tabs"><button class="section-tab ${state.projectTab==='gallery'?'active':''}" data-action="tab" data-value="gallery">Photo gallery</button><button class="section-tab ${state.projectTab==='history'?'active':''}" data-action="tab" data-value="history">Activity timeline</button><button class="section-tab ${state.projectTab==='details'?'active':''}" data-action="tab" data-value="details">Vehicle details</button></nav>`;
if(state.projectTab==='gallery'){html+=`<div class="media-tools"><button class="btn" data-action="take-photo">◎ Take photo</button><button class="btn btn-soft" data-action="add-photo">↑ Import originals</button><button class="btn btn-soft" data-action="export-manifest">↓ Export catalog</button></div><div class="toolbar"><label class="searchbox"><span>⌕</span><input id="searchInput" type="search" value="${safe(state.search)}" placeholder="Search captions and filenames" aria-label="Search photos"></label></div>${filterButtons()}<div style="height:19px"></div>${renderGallery(activePhotos())}`;
}else if(state.projectTab==='history'){const assets=state.assets.filter(a=>a.projectId===p.id);html+=assets.length?`<section class="hint-panel"><strong>Activity timeline</strong><p>Newest additions first. In the production version, these entries will include technician attribution, verified uploads and inspection references.</p></section><div class="gallery-grid" style="margin-top:16px">${assets.map(a=>`<button class="image-card" data-action="photo-detail" data-id="${safe(a.id)}"><div class="image-wrap"><img alt="${safe(a.name)}" src="${imageUrl(a)}"></div><div class="image-body"><strong>${safe(shortDate(a.uploadedAt))} · ${safe(a.category)}</strong><small>${safe(a.name)}</small></div></button>`).join('')}</div>`:emptyGallery();}
else{html+=`<section class="hint-panel"><h3>Vehicle record</h3><p><strong>Name:</strong> ${safe(p.name)}</p><p><strong>Work order:</strong> ${safe(p.reference||'Not linked yet')}</p><p><strong>Project status:</strong> ${safe(p.status||'Active')}</p><p>Shopmonkey connection is planned, not active in this preview. No invoice or customer record is created by changing these fields.</p><button class="btn btn-soft" data-action="edit-project">Edit project details</button></section>`;} $('app').innerHTML=html;filterLocal();}
function renderMediaView(){const titles={library:['ALL MEDIA','Every photo, one place.','Browse imported media from every project.'],unsorted:['UNSORTED','A home for loose ends.','Find a photo, identify its vehicle, and give it a permanent home.'],review:['REVIEW','Worth a closer look.','A working shortlist for future customer updates and content approval.']};const [tag,title,desc]=titles[state.route];$('crumb').textContent=tag;let html=header({eyebrow:'WORKSHOP / MEDIA',title,description:desc,actions:`<button class="btn" data-action="add-photo">＋ Add photos</button>`});html+=notice();if(state.route==='review')html+=`<section class="hint-panel" style="margin-bottom:17px"><strong>For review does not mean approved or published.</strong><p>Media candidates remain private. Future marketing approval will require an authorized manager and confirmed customer/media rights.</p></section>`;
html+=`<div class="toolbar"><label class="searchbox"><span>⌕</span><input id="searchInput" type="search" value="${safe(state.search)}" placeholder="Search images, vehicles and notes" aria-label="Search all media"></label><button class="btn btn-soft" data-action="export-manifest">↓ Export catalog</button></div>${filterButtons()}<div style="height:19px"></div>${renderGallery(activePhotos())}`;$('app').innerHTML=html;filterLocal();}
function filterLocal(){const q=state.search.trim().toLowerCase();document.querySelectorAll('.filterable').forEach(el=>{el.hidden=Boolean(q&&!String(el.dataset.search||'').includes(q));});}
function closeModal(){const el=$('modalBackdrop');if(el.hidden)return;el.hidden=true;el.classList.remove('photo-modal');el.querySelector('#modalContent').innerHTML='';if(lastFocus?.isConnected)lastFocus.focus();state.modal=null;}
function showModal(markup,type='standard'){lastFocus=document.activeElement;const el=$('modalBackdrop');el.hidden=false;el.classList.toggle('photo-modal',type==='photo');$('modalContent').innerHTML=markup;state.modal=type;el.querySelector('button')?.focus();}
function modalHead(title,desc){return `<div class="modal-head"><div><h2>${safe(title)}</h2><p>${safe(desc||'')}</p></div><button type="button" class="xbtn" data-action="close-modal" aria-label="Close dialog">×</button></div>`;}
function projectSelector(id='',optional=true){return `<select id="targetProject">${optional?'<option value="">Unsorted (assign later)</option>':''}${state.projects.map(p=>`<option value="${safe(p.id)}" ${p.id===id?'selected':''}>${safe(p.name)}</option>`).join('')}</select>`;}
function categorySelector(value='Progress'){return `<select id="targetCategory">${CATEGORIES.map(c=>`<option ${value===c?'selected':''}>${safe(c)}</option>`).join('')}</select>`;}
function editProject(p=null){showModal(modalHead(p?'Edit vehicle project':'Add vehicle project',p?'Update details without changing media files.':'Create a vehicle workspace before taking photos.')+`<form id="projectForm" class="modal-body"><div class="field"><label for="projectName">Vehicle / project name</label><input id="projectName" maxlength="100" placeholder="e.g. 1960 Chevrolet Corvette" value="${safe(p?.name||'')}" required></div><div class="form-grid"><div class="field"><label for="projectRO">Shopmonkey RO (optional)</label><input id="projectRO" maxlength="60" value="${safe(p?.reference||'')}" placeholder="Work order / reference"></div><div class="field"><label for="projectStatus">Status</label><select id="projectStatus"><option value="active" ${p?.status!=='complete'?'selected':''}>Active</option><option value="complete" ${p?.status==='complete'?'selected':''}>Complete</option></select></div></div><div class="modal-actions"><button class="btn btn-soft" data-action="close-modal" type="button">Cancel</button><button class="btn" type="submit">${p?'Save vehicle':'Create project'}</button></div></form>`);$('projectForm').onsubmit=async e=>{e.preventDefault();const name=$('projectName').value.trim();if(!name)return;const x=p?{...p,name,reference:$('projectRO').value.trim(),status:$('projectStatus').value,demo:false}:{id:newid(),name,reference:$('projectRO').value.trim(),status:$('projectStatus').value,createdAt:new Date().toISOString(),demo:false};await put('projects',x);await load();closeModal();render();toast('Vehicle saved on this device.');};}
function uploadDialog(initialProjectId){showModal(modalHead('Add vehicle photos','Select an existing project and bring in original photographs.')+`<div class="modal-body"><button type="button" class="import-tile" data-action="choose-files"><span class="bigicon">↑</span><strong>Choose photos from this device</strong><small>JPEG, PNG, HEIC and other supported images</small></button><p id="selectionLabel" class="import-file-count" aria-live="polite">No photos selected</p><div class="form-grid"><div class="field"><label for="targetProject">Vehicle project</label>${projectSelector(initialProjectId)}</div><div class="field"><label for="targetCategory">Photo category</label>${categorySelector()}</div></div><div class="field"><label for="importNote">Optional note for this batch</label><input id="importNote" placeholder="e.g. Driver side quarter repair"></div><div class="danger-note">Local demo: these files do not upload to a shared server and will not appear on other phones. Please keep your original images.</div><div class="modal-actions"><button class="btn btn-soft" type="button" data-action="close-modal">Cancel</button><button id="commitImport" class="btn" data-action="commit-import" disabled>Save photos locally</button></div></div>`);state.pendingFiles=[];}
function setPending(files){if(!state.modal)return;state.pendingFiles=Array.from(files||[]).filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));const label=$('selectionLabel');if(label)label.textContent=state.pendingFiles.length?`${state.pendingFiles.length} selected ${state.pendingFiles.length===1?'photo':'photos'}`:'No compatible image files selected';if($('commitImport'))$('commitImport').disabled=!state.pendingFiles.length;}
async function persistPending(){const input=$('commitImport');if(!input||!state.pendingFiles?.length)return;input.disabled=true;let done=0,fail=0;let projectId=$('targetProject').value,cat=$('targetCategory').value,caption=$('importNote').value.trim();for(const file of state.pendingFiles){try{if(file.size>32*1024*1024){fail++;continue;}const a={id:newid(),name:file.name,projectId,category:cat,caption,uploadedAt:new Date().toISOString(),fileModifiedAt:file.lastModified?new Date(file.lastModified).toISOString():null,size:file.size,mime:file.type,blob:file,review:false};await put('assets',a);done++;}catch(e){console.warn('Local import failed',e);fail++;}}await load();closeModal();render();toast(`${done} ${done===1?'photo':'photos'} saved locally${fail?` · ${fail} failed/skipped`:''}. Not shared or backed up.`);}
function startCamera(){const picker=$('cameraPicker');picker.value='';picker.click();}
function openUpload(projectId){uploadDialog(projectId||'');}
function photoDetail(id){const a=state.assets.find(x=>x.id===id);if(!a)return;const u=imageUrl(a);showModal(`${modalHead('Photo details','Original retained in this browser. No external sharing.')}
<div class="photo-detail"><div class="photo-preview"><img alt="${safe(a.name)}" src="${u}"><div class="origin-note">${safe(a.name)} · ${bytes(a.size)}</div></div><form id="photoForm" class="photo-sidebar"><h3>${safe(a.name)}</h3><div class="sample-note">File date ${shortDate(a.fileModifiedAt)}</div><div class="field"><label for="targetProject">Vehicle</label>${projectSelector(a.projectId)}</div><div class="field"><label for="targetCategory">Category</label>${categorySelector(a.category)}</div><div class="field"><label for="assetCaption">Caption / repair note</label><textarea id="assetCaption" maxlength="600" placeholder="What does this photo show?">${safe(a.caption||'')}</textarea></div><div class="field"><label class="checkbox-label"><input id="reviewBox" type="checkbox" ${a.review?'checked':''}> Add to media review queue</label></div><div class="danger-note">Review queue is private. This does not publish or approve use on social media, your website, or customer reports.</div><div class="modal-actions"><button class="btn btn-soft" type="button" data-action="download-original" data-id="${safe(a.id)}">↓ Original</button><button class="btn" type="submit">Save details</button></div></form></div>`, 'photo');$('photoForm').onsubmit=async e=>{e.preventDefault();await put('assets',{...a,projectId:$('targetProject').value,category:$('targetCategory').value,caption:$('assetCaption').value.trim(),review:$('reviewBox').checked});await load();closeModal();render();toast('Details saved locally.');};}
function downloadOriginal(id){const a=state.assets.find(p=>p.id===id);if(!a)return;const u=URL.createObjectURL(a.blob);const l=document.createElement('a');l.href=u;l.download=a.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),8000);}
function exportManifest(){const manifest={format:'socal-media-local-demo-v02',exportedAt:new Date().toISOString(),note:'Metadata only. Original photos are not included. Do not treat as a backup.',projects:state.projects.map(({id,name,status,reference})=>({id,name,status,reference})),photos:state.assets.map(({blob,...a})=>a)};const b=new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'});const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='socal-media-local-manifest.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),8000);toast('Metadata downloaded. Photo files are NOT included.');}
function about(){showModal(modalHead('What you can test','SoCal Media v0.2 — independent workflow preview')+`<div class="modal-body"><div class="about-grid"><div class="hint-panel"><div class="eyebrow">WORKING</div><h3>Projects & photos</h3><p>Vehicle records, local photo import, camera input, photo notes, search, category filters, reassignment, private review shortlist, original download and metadata manifest.</p></div><div class="hint-panel"><div class="eyebrow">NOT YET CONNECTED</div><h3>Shared shop system</h3><p>Cloud storage, employee login, second-phone sharing, Shopmonkey, Inspection evidence, upload retries, approvals and backups are intentionally not live.</p></div></div><div class="danger-note">Do not place confidential, unbacked-up customer images into a browser prototype. Your original photos should remain in Apple Photos or another verified archive.</div><div class="modal-actions"><button class="btn" data-action="close-modal">Understood</button></div></div>`);}
function bind(){document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>selectRoute(b.dataset.route)));$('helpBtn').onclick=about;
$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'&&!$('modalBackdrop').hidden){const items=[...$('modalContent').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(n=>n.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('photoPicker').onchange=e=>setPending(e.target.files);$('cameraPicker').onchange=e=>{const files=e.target.files;if(!files?.length)return;if(state.modal){setPending(files);}else{openUpload(state.projectId||'');setPending(files);}};
document.addEventListener('input',e=>{if(e.target?.id==='searchInput'){state.search=e.target.value;filterLocal();}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;switch(action){case'new-project':editProject();break;case'open-project':openProject(id);break;case'back':openProject(null);state.projectId=null;render();break;case'edit-project':editProject(getProject(state.projectId));break;case'add-photo':openUpload(state.projectId);break;case'choose-files':$('photoPicker').value='';$('photoPicker').click();break;case'take-photo':startCamera();break;case'photo-detail':photoDetail(id);break;case'filter':state.filter=el.dataset.value;render();break;case'tab':state.projectTab=el.dataset.value;render();break;case'close-modal':closeModal();break;case'commit-import':void persistPending();break;case'download-original':downloadOriginal(id);break;case'export-manifest':exportManifest();break;}});
}
init().catch(err=>{console.error(err);$('app').innerHTML=`<section class="notice"><span class="notice-icon">!</span><p><b>Browser storage is unavailable.</b> Open this preview in current Chrome or Safari with local IndexedDB enabled. No data was transferred to a server.</p></section>`;});
})();

</script>
</body>
</html>
