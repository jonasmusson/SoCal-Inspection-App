async function connect(){
 return await new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,VERSION);
  req.onupgradeneeded=()=>{
   const d=req.result;

async function init(){

 if(!state.projects.length&&!state.vehicles.length){
  for(const p of FALLBACK)await put('projects',{...p,id:newid(),createdAt:new Date().toISOString(),demo:true});
  await load();
 }
 // Safe local-only upgrade: legacy projects held vehicle fields together. Split one
 // vehicle per legacy project, keeping the original project ID and photo links.
 for(const p of state.projects.filter(p=>!p.vehicleId)){
  let v=state.vehicles.find(v=>v.legacyProjectId===p.id);
  if(!v){
   v={id:newid(),displayName:p.name,year:p.year||'',make:p.make||'',model:p.model||'',vin:'',customerId:'',source:'manual',legacyProjectId:p.id,createdAt:p.createdAt||new Date().toISOString(),demo:!!p.demo};
   await put('vehicles',v);state.vehicles.push(v);
  }
  await put('projects',{...p,vehicleId:v.id,customerId:'',type:p.type||'general',name:p.demo?'Ongoing work':p.name,notes:p.notes||'',source:'manual'});
 }
 await load();bind();render();

}
function vehicleSelector(id='',elementId='vehicleSelect'){
 return `<select id="${safe(elementId)}" required><option value="">Choose vehicle</option>${state.vehicles.map(v=>`<option value="${safe(v.id)}" ${v.id===id?'selected':''}>${safe(v.displayName)}</option>`).join('')}</select>`;
}
function categorySelector(value='Progress'){return `<select id="targetCategory">${CATEGORIES.map(c=>`<option ${value===c?'selected':''}>${safe(c)}</option>`).join('')}</select>`;}
function editProject(p=null,vehicleId=''){
 if(!state.vehicles.length){toast('Add a vehicle profile first. No inspection required.');return editVehicle();}
 const chosenVehicle=vehicleId||p?.vehicleId||'';
 const cid=p?.customerId||getVehicle(chosenVehicle)?.customerId||'';
 showModal(modalHead(p?'Edit work project':'Start a project',p?'Changes stay linked to the same vehicle.':'Choose an existing vehicle. No inspection or Shopmonkey work order required.')+`<form id="projectForm" class="modal-body"><div class="field"><label for="vehicleSelect">Vehicle *</label>${vehicleSelector(chosenVehicle)}</div><div class="field"><label for="projectName">Project name *</label><input id="projectName" maxlength="100" placeholder="Restoration, brake upgrades, photo shoot…" value="${safe(p?.name||'Ongoing work')}" required></div><div class="form-grid"><div class="field"><label for="projectType">Project type</label><select id="projectType">${['general','restoration','repair','fabrication','transport','inspection','content production'].map(t=>`<option value="${t}" ${(p?.type||'general')===t?'selected':''}>${safe(t)}</option>`).join('')}</select></div><div class="field"><label for="projectStatus">Status</label><select id="projectStatus"><option value="active" ${p?.status!=='complete'?'selected':''}>Active</option><option value="complete" ${p?.status==='complete'?'selected':''}>Complete</option></select></div></div><div class="field"><label for="customerSelect">Customer (optional)</label>${customerSelector(cid)}</div><div class="field"><label for="projectRO">Shopmonkey work order (optional · not synced)</label><input id="projectRO" maxlength="60" value="${safe(p?.reference||'')}" placeholder="RO / reference"></div><div class="field"><label for="projectNotes">Work requested / project notes</label><textarea id="projectNotes" maxlength="1000">${safe(p?.notes||'')}</textarea></div><div class="danger-note">Creating a project here never creates an inspection, invoice, timecard or Shopmonkey order.</div><div class="modal-actions"><button class="btn btn-soft" data-action="close-modal" type="button">Cancel</button><button class="btn" type="submit">${p?'Save project':'Create project'}</button></div></form>`);
 $('projectForm').onsubmit=async e=>{e.preventDefault();const vehicleId=$('vehicleSelect').value;if(!getVehicle(vehicleId))return;const name=$('projectName').value.trim();if(!name)return;const x={...(p||{}),id:p?.id||newid(),vehicleId,customerId:$('customerSelect').value,name,type:$('projectType').value,status:$('projectStatus').value,reference:$('projectRO').value.trim(),notes:$('projectNotes').value.trim(),createdAt:p?.createdAt||new Date().toISOString(),demo:false,source:p?.source||'manual'};await put('projects',x);await load();closeModal();openProject(x.id);toast('Project saved locally. No inspection created.');};
}
function editCustomer(c=null){
 showModal(modalHead(c?'Edit customer':'Add customer',c?'Edit this profile without altering work orders.':'A customer record is independent of inspections and work orders.')+`<form id="customerForm" class="modal-body"><div class="field"><label for="customerName">Customer / organization name *</label><input id="customerName" required maxlength="160" value="${safe(c?.name||'')}" placeholder="Person or business"></div><div class="form-grid"><div class="field"><label for="customerEmail">Email (optional)</label><input type="email" id="customerEmail" maxlength="180" value="${safe(c?.email||'')}" placeholder="Email"></div><div class="field"><label for="customerPhone">Phone (optional)</label><input id="customerPhone" maxlength="40" value="${safe(c?.phone||'')}" placeholder="Phone"></div></div><div class="field"><label for="customerNotes">Notes</label><textarea id="customerNotes" maxlength="900">${safe(c?.notes||'')}</textarea></div><div class="danger-note">Local record only. Shopmonkey remains the authority for customer billing. This preview does not contact anyone or sync customer details.</div><div class="modal-actions"><button type="button" class="btn btn-soft" data-action="close-modal">Cancel</button><button class="btn" type="submit">${c?'Save customer':'Create customer'}</button></div></form>`);
 $('customerForm').onsubmit=async e=>{e.preventDefault();const name=$('customerName').value.trim();if(!name)return;const x={...(c||{}),id:c?.id||newid(),name,email:$('customerEmail').value.trim(),phone:$('customerPhone').value.trim(),notes:$('customerNotes').value.trim(),source:c?.source||'manual',createdAt:c?.createdAt||new Date().toISOString()};await put('customers',x);await load();closeModal();openCustomer(x.id);toast('Customer created independently. No inspection created.');};
}
function editVehicle(v=null,customerId=''){
 const cid=customerId||v?.customerId||'';
 showModal(modalHead(v?'Edit vehicle profile':'Create vehicle','No inspection, work order or customer is required to save this vehicle.')+`<form id="vehicleForm" class="modal-body"><div class="field"><label for="vehicleName">Vehicle display name *</label><input id="vehicleName" maxlength="150" required value="${safe(v?.displayName||'')}" placeholder="e.g. 1967 Mustang Convertible"></div><div class="form-grid"><div class="field"><label for="vehicleYear">Year (optional)</label><input id="vehicleYear" inputmode="numeric" maxlength="4" pattern="[0-9]{0,4}" value="${safe(v?.year||'')}"></div><div class="field"><label for="vehicleMake">Make (optional)</label><input id="vehicleMake" maxlength="80" value="${safe(v?.make||'')}"></div></div><div class="form-grid"><div class="field"><label for="vehicleModel">Model (optional)</label><input id="vehicleModel" maxlength="100" value="${safe(v?.model||'')}"></div><div class="field"><label for="vehicleVin">VIN / chassis number (optional)</label><input id="vehicleVin" maxlength="60" value="${safe(v?.vin||'')}"></div></div><div class="field"><label for="vehicleOwner">Customer / current project owner (optional)</label>${customerSelector(cid,'vehicleOwner')}</div><div class="field"><label for="vehicleNotes">Notes</label><textarea id="vehicleNotes" maxlength="1000">${safe(v?.notes||'')}</textarea></div><div class="danger-note">Creates a vehicle profile only. You can add photos immediately and create any number of projects later.</div><div class="modal-actions"><button class="btn btn-soft" data-action="close-modal" type="button">Cancel</button><button class="btn" type="submit">${v?'Save vehicle':'Create vehicle'}</button></div></form>`);
 $('vehicleForm').onsubmit=async e=>{e.preventDefault();const displayName=$('vehicleName').value.trim();if(!displayName)return;const x={...(v||{}),id:v?.id||newid(),displayName,year:$('vehicleYear').value.trim(),make:$('vehicleMake').value.trim(),model:$('vehicleModel').value.trim(),vin:$('vehicleVin').value.trim().toUpperCase(),customerId:$('vehicleOwner').value,notes:$('vehicleNotes').value.trim(),source:v?.source||'manual',createdAt:v?.createdAt||new Date().toISOString(),demo:false};await put('vehicles',x);await load();closeModal();openVehicle(x.id);toast('Vehicle created. No inspection or work order created.');};
}
function uploadDialog(initialProjectId='',initialVehicleId=''){
 const selected=initialProjectId?`project:${initialProjectId}`:initialVehicleId?`vehicle:${initialVehicleId}`:'';
 showModal(modalHead('Add photos','Choose a project, vehicle or Unsorted. Existing customers and inspections are not required.')+`<div class="modal-body"><button type="button" class="import-tile" data-action="choose-files"><span class="bigicon">↑</span><strong>Choose photos from this device</strong><small>JPEG, PNG, HEIC and other supported images</small></button><p id="selectionLabel" class="import-file-count" aria-live="polite">No photos selected</p><div class="form-grid"><div class="field"><label for="targetMediaHome">Save photos under</label>${mediaTargetSelector(selected)}</div><div class="field"><label for="targetCategory">Photo category</label>${categorySelector()}</div></div><div class="field"><label for="importNote">Optional batch note</label><input id="importNote" placeholder="e.g. Driver side quarter repair"></div><div class="danger-note">Local demo only: photos stay in this browser. They do not synchronize to phones or a server. Preserve originals separately.</div><div class="modal-actions"><button class="btn btn-soft" type="button" data-action="close-modal">Cancel</button><button id="commitImport" class="btn" data-action="commit-import" disabled>Save photos locally</button></div></div>`);state.pendingFiles=[];$('photoPicker').value='';
}
function setPending(files){if(!state.modal)return;state.pendingFiles=Array.from(files||[]).filter(f=>f.type.startsWith('image/')||/\.(heic|heif)$/i.test(f.name));const label=$('selectionLabel');if(label)label.textContent=state.pendingFiles.length?`${state.pendingFiles.length} selected ${state.pendingFiles.length===1?'photo':'photos'}`:'No compatible image files selected';if($('commitImport'))$('commitImport').disabled=!state.pendingFiles.length;}
async function persistPending(){
 const input=$('commitImport');if(!input||!state.pendingFiles?.length)return;
 input.disabled=true;let done=0,fail=0;const association=mediaAssociation($('targetMediaHome').value),cat=$('targetCategory').value,caption=$('importNote').value.trim();
 for(const file of state.pendingFiles){try{
  if(file.size>32*1024*1024){fail++;continue;}
  const a={id:newid(),name:file.name,...association,category:cat,caption,uploadedAt:new Date().toISOString(),fileModifiedAt:file.lastModified?new Date(file.lastModified).toISOString():null,size:file.size,mime:file.type,blob:file,review:false};
  await put('assets',a);done++;
 }catch(error){console.warn('Local import failed',error);fail++;}}
 await load();closeModal();render();toast(`${done} photo(s) saved locally${fail?` · ${fail} skipped`:''}. No cloud sync or backup.`);
}
function startCamera(){const picker=$('cameraPicker');picker.value='';picker.click();}
function openUpload(projectId='',vehicleId=''){uploadDialog(projectId||'',vehicleId||'');}
function photoDetail(id){
 const a=state.assets.find(x=>x.id===id);if(!a)return;const u=imageUrl(a);
 showModal(`${modalHead('Photo details','Original preserved in this browser only — no external sharing.')}
 <div class="photo-detail"><div class="photo-preview"><img alt="${safe(a.name)}" src="${u}"><div class="origin-note">${safe(a.name)} · ${bytes(a.size)}</div></div><form id="photoForm" class="photo-sidebar"><h3>${safe(a.name)}</h3><div class="sample-note">Source file date ${shortDate(a.fileModifiedAt)}</div><div class="field"><label for="targetMediaHome">Vehicle or project</label>${mediaTargetSelector(mediaTarget(a))}</div><div class="field"><label for="targetCategory">Category</label>${categorySelector(a.category)}</div><div class="field"><label for="assetCaption">Caption / repair note</label><textarea id="assetCaption" maxlength="600" placeholder="What does this photo show?">${safe(a.caption||'')}</textarea></div><div class="field"><label class="checkbox-label"><input id="reviewBox" type="checkbox" ${a.review?'checked':''}> Add to private media review shortlist</label></div><div class="danger-note">Review is not customer approval or permission to publish.</div><div class="modal-actions"><button class="btn btn-soft" type="button" data-action="download-original" data-id="${safe(a.id)}">↓ Original</button><button class="btn" type="submit">Save details</button></div></form></div>`, 'photo');
 $('photoForm').onsubmit=async e=>{e.preventDefault();await put('assets',{...a,...mediaAssociation($('targetMediaHome').value),category:$('targetCategory').value,caption:$('assetCaption').value.trim(),review:$('reviewBox').checked});await load();closeModal();render();toast('Photo linked to chosen vehicle or project.');};
}
function downloadOriginal(id){const a=state.assets.find(p=>p.id===id);if(!a)return;const u=URL.createObjectURL(a.blob);const l=document.createElement('a');l.href=u;l.download=a.name;l.click();setTimeout(()=>URL.revokeObjectURL(u),8000);}
function exportManifest(){
 const manifest={format:'socal-hub-local-demo-v03',exportedAt:new Date().toISOString(),note:'METADATA ONLY. Does not include original photos, customer source-of-truth or live API links. Not a backup.',customers:state.customers,vehicles:state.vehicles,projects:state.projects,photos:state.assets.map(({blob,...a})=>a)};
 const b=new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'});const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='socal-hub-local-catalog.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),8000);toast('Metadata downloaded — not original image files.');
}
function about(){
 showModal(modalHead('What you can test','SoCal Hub v0.3 — separate customer, vehicle and project records')+`<div class="modal-body"><div class="about-grid"><div class="hint-panel"><div class="eyebrow">WORKING LOCALLY</div><h3>Independent records</h3><p>Create customers, vehicles and projects in any valid sequence, without an inspection. Link existing records; browse and import photos with optional vehicle-only assignment.</p></div><div class="hint-panel"><div class="eyebrow">NOT LIVE</div><h3>Shared workflows</h3><p>Shopmonkey, employee timecards, billing, inspection evidence, cross-device cloud uploads and backups are not yet connected. They will reference the same permanent IDs rather than duplicating entry.</p></div></div><div class="danger-note">This is a browser-local design prototype. Do not use it to store unbacked-up customer information or irreplaceable photographs.</div><div class="modal-actions"><button class="btn" data-action="close-modal">Understood</button></div></div>`);
}
function bind(){
 document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>selectRoute(b.dataset.route)));
 $('helpBtn').onclick=about;
 $('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'&&!$('modalBackdrop').hidden){const items=[...$('modalContent').querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(n=>n.getClientRects().length);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 $('photoPicker').onchange=e=>setPending(e.target.files);
 $('cameraPicker').onchange=e=>{const files=e.target.files;if(!files?.length)return;if(state.modal)setPending(files);else{openUpload(state.projectId||'',state.vehicleId||'');setPending(files);}};
 document.addEventListener('input',e=>{if(e.target?.id==='searchInput'){state.search=e.target.value;filterLocal();}});
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,id=el.dataset.id;
  switch(action){
   case'new-project':editProject();break;
   case'new-project-for-vehicle':editProject(null,state.vehicleId);break;
   case'new-customer':editCustomer();break;
   case'new-vehicle':editVehicle();break;
   case'new-vehicle-for-customer':editVehicle(null,state.customerId);break;
   case'open-project':openProject(id);break;
   case'open-vehicle':case'go-vehicle':openVehicle(id);break;
   case'open-customer':case'go-customer':openCustomer(id);break;
   case'back-projects':selectRoute('projects');break;
   case'back-vehicles':selectRoute('vehicles');break;
   case'back-customers':selectRoute('customers');break;
   case'edit-project':editProject(getProject(state.projectId));break;
   case'edit-vehicle':editVehicle(getVehicle(state.vehicleId));break;
   case'edit-customer':editCustomer(getCustomer(state.customerId));break;
   case'add-photo':openUpload(state.projectId||'',state.vehicleId||'');break;
   case'choose-files':$('photoPicker').value='';$('photoPicker').click();break;
   case'take-photo':startCamera();break;
   case'photo-detail':photoDetail(id);break;
   case'filter':state.filter=el.dataset.value;render();break;
   case'tab':state.projectTab=el.dataset.value;render();break;
   case'close-modal':closeModal();break;
   case'commit-import':void persistPending();break;
   case'download-original':downloadOriginal(id);break;
   case'export-manifest':exportManifest();break;
  }
 });
}
init().catch(err=>{console.error(err);$('app').innerHTML=`<section class="notice"><span class="notice-icon">!</span><p><b>Browser storage is unavailable.</b> Open this preview in current Chrome or Safari with local IndexedDB enabled. No data was transferred to a server.</p></section>`;});
})();

</script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Workspace navigation">
      <div class="identity"><div class="mark" aria-hidden="true">S<span>∕</span></div><div><b>SOCAL <em>HUB</em></b><small>WORKSHOP / MEDIA</small></div></div>
      <p class="nav-label">WORKSPACE</p>
      <nav class="main-nav" aria-label="Sections">
        <button class="nav-link active" data-route="projects" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span><span>Projects</span></button>
        <button class="nav-link" data-route="vehicles"><span class="nav-icon" aria-hidden="true">◇</span><span>Vehicles</span></button>
        <button class="nav-link" data-route="customers"><span class="nav-icon" aria-hidden="true">◎</span><span>Customers</span></button>
        <button class="nav-link" data-route="library"><span class="nav-icon" aria-hidden="true">▥</span><span>All media</span></button>
        <button class="nav-link" data-route="unsorted"><span class="nav-icon" aria-hidden="true">◫</span><span>Unsorted</span><span id="unsortedCount" class="nav-count"></span></button>
        <button class="nav-link" data-route="review"><span class="nav-icon" aria-hidden="true">◇</span><span>For review</span><span id="reviewCount" class="nav-count"></span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-divider"></div>
        <div class="account"><div class="avatar">SA</div><div><strong>SoCal Autoworks</strong><small>Workspace preview</small></div></div>
        <div class="local-label"><span class="signal"></span> LOCAL PREVIEW · NO CLOUD</div>
        <p>Photos are saved in this browser only. Your shop phones cannot see them yet.</p>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar"><div class="breadcrumb">SOCAL HUB <span>/</span> <strong id="crumb">MEDIA</strong></div><div class="top-actions"><span class="status-dot"></span><span class="top-status">PRIVATE WORKFLOW PREVIEW</span><button id="helpBtn" class="text-btn">What is this?</button></div></header>
      <main id="app" tabindex="-1" aria-live="polite"></main>
      <footer class="site-footer"><span>SoCal Hub · v0.3 workflow preview</span><span>Shop data stays untouched</span></footer>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <button class="mobile-link active" data-route="projects"><span aria-hidden="true">▦</span>Projects</button>
    <button class="mobile-link" data-route="vehicles"><span aria-hidden="true">◇</span>Vehicles</button>
    <button class="mobile-link" data-route="customers"><span aria-hidden="true">◎</span>Customers</button>
    <button class="mobile-link" data-route="library"><span aria-hidden="true">▥</span>Media</button>
  </nav>
  <input id="photoPicker" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,image/*" multiple>
  <input id="cameraPicker" class="sr-only" type="file" accept="image/*" capture="environment">
  <div id="modalBackdrop" class="modal-backdrop" hidden><div id="modalContent" class="modal-card" role="dialog" aria-modal="true" aria-label="SoCal Media dialog"></div></div>
